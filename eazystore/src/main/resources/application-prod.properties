spring.application.name=eazystore

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.root=${LOG_LEVEL:INFO}

# Render injects PORT and the app must bind to it (default 10000).
server.port=${PORT:5000}

# Behind Render's proxy, so redirects and generated URLs use https.
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslMode=REQUIRED
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${JPA_SHOW_URL:false}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.datasource.hikari.maximum-pool-size=5

#stripe
stripe.apiKey=${STRIPE_API_KEY}


#actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.configprops.show-values=never
management.endpoint.health.probes.enabled=true

eazystore.cors.allowed-origins=${FRONTEND_URL}

contact.phone=+91-1234567896
contact.email=prod@eazystore.com
contact.address=123 Main Street, NewYork, USA

